<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>探索 | Minimal Discovery</title>
    <style>
        /* 基礎樣式設定 */
        :root {
            --bg-color: #fcfcfc;
            --text-primary: #1a1a1a;
            --text-secondary: #666;
            --accent: #000;
            --accent-hover: #333;
            --transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-primary);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
        }

        /* 網頁容器動畫 */
        .content {
            text-align: center;
            opacity: 0;
            transform: translateY(20px);
            animation: fadeIn 1s forwards;
        }

        h1 {
            font-size: 2.5rem;
            font-weight: 300;
            letter-spacing: 0.1em;
            margin-bottom: 1rem;
        }

        p {
            color: var(--text-secondary);
            font-size: 0.9rem;
            letter-spacing: 0.05em;
            margin-bottom: 3rem;
            text-transform: uppercase;
        }

        /* 簡約按鈕樣式 */
        .cta-button {
            display: inline-block;
            padding: 1rem 3rem;
            border: 1px solid var(--accent);
            color: var(--accent);
            text-decoration: none;
            font-size: 0.85rem;
            letter-spacing: 0.2em;
            text-transform: uppercase;
            transition: var(--transition);
            position: relative;
            background: transparent;
        }

        .cta-button:hover {
            background-color: var(--accent);
            color: #fff;
            padding: 1rem 3.5rem;
        }

        /* 動畫效果 */
        @keyframes fadeIn {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* 點擊時的波紋效果提示 */
        .click-feedback {
            position: absolute;
            bottom: 2rem;
            font-size: 0.7rem;
            color: #ccc;
            letter-spacing: 1px;
        }
    </style>
</head>
<body>

    <div class="content">
        <h1>精粹</h1>
        <p>探索簡約之美</p>
        
        <!-- 目標連結按鈕 -->
        <a href="23232323232.html" class="cta-button" id="enterButton">
            進入頁面
        </a>
    </div>

    <div class="click-feedback">點擊按鈕跳轉至目標內容</div>

    <script>
        // JavaScript 互動邏輯
        window.addEventListener('DOMContentLoaded', () => {
            const button = document.getElementById('enterButton');

            // 增加一個平滑的點擊日誌或轉場預留
            button.addEventListener('click', (e) => {
                // 這裡可以加入額外的淡出動畫，如果需要更高級的轉場
                console.log('正在跳轉至 23232323232.html');
            });

            // 滑鼠移動時的輕微互動（視差效果）
            document.addEventListener('mousemove', (e) => {
                const moveX = (e.clientX - window.innerWidth / 2) * 0.01;
                const moveY = (e.clientY - window.innerHeight / 2) * 0.01;
                document.querySelector('.content').style.transform = `translate(${moveX}px, ${moveY}px)`;
            });
        });
    </script>

</body>
</html>
